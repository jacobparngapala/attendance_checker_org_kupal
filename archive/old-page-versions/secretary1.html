<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css" rel="stylesheet" />
    <title>EAST-Y CHECK</title>
    <link rel="stylesheet" />
    <style>
        @import url("https://fonts.googleapis.com/css2?family=Poppins:wght@200;300;400;500;600;700&display=swap");

        
        body {
            display: flex;
            margin: 0;
            font-family: 'Poppins', sans-serif;
        }

       
        .navbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px;
            background-color: #f8f9fa;
            position: fixed;
            top: 0;
            left: 250px; 
            right: 0;
            z-index: 1000;
            transition: left 0.3s ease; 
        }

        
        .sidebar {
            width: 250px;
            height: 100vh; 
            position: fixed;
            top: 0;
            left: 0;
            background-color: #343a40;
            color: white;
            padding-top: 20px;
            transition: transform 0.3s ease;
            transform: translateX(0); 
        }

        .sidebar.closed {
            transform: translateX(-100%); 
        }

        .main-content {
            margin-left: 250px; 
            padding: 20px;
            flex-grow: 1;
            overflow-y: auto; 
            height: 100vh; 
            position: relative;
            transition: margin-left 0.3s ease;
        }

        .main-content.shifted {
            margin-left: 0; 
        }

   
        @media (max-width: 768px) {
            .navbar {
                left: 0;
                right: 0;
            }

            .sidebar {
                width: 200px; 
            }

            .main-content {
                margin-left: 200px;    
            }
        }
    </style>
    <link href="./css/dashboard.css" rel="stylesheet" />
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css">
    <link rel="stylesheet" href="./css/navbar.css">
    <link rel="stylesheet" href="./css/styles.css">
</head>

<body>
    <!-- Sidebar -->
    <nav class="sidebar" aria-label="Sidebar Navigation">
        <div class="menu_content">
            <ul class="menu_items">
                <li class="item">
                    <a href="#" class="nav_link submenu_item">
                        <span class="navlink_icon">
                            <i class="bx bx-user"></i>
                        </span>
                        <span class="navlink">Profile</span>
                    </a>
                </li>
                <li class="item">
                    <a href="homepage.html" class="nav_link submenu_item">
                        <span class="navlink_icon">
                            <i class="bx bx-home-alt"></i>
                        </span>
                        <span class="navlink">Dashboard</span>
                    </a>
                </li>
                <li class="item">
                    <a href="#" class="nav_link submenu_item">
                        <span class="navlink_icon">
                            <i class="bx bx-grid-alt"></i>
                        </span>
                        <span class="navlink">Overview</span>
                    </a>
                </li>
            </ul>
            <ul class="menu_items">
                <div class="menu_title menu_editor"></div>
                <li class="item active">
                    <a href="classes selection.html" class="nav_link">
                        <span class="navlink_icon">
                            <i class="bx bx-list-ul"></i>
                        </span>
                        <span class="navlink"> Classes</span>
                    </a>
                </li>
                <li class="item">
                    <a href="#" class="nav_link">
                        <span class="navlink_icon">
                            <i class="bx bx-cloud-upload"></i>
                        </span>
                        <span class="navlink">Summary</span>
                    </a>
                </li>
            </ul>
            <ul class="menu_items">
                <div class="menu_title menu_setting"></div>
                <li class="item">
                    <a href="#" class="nav_link">
                        <span class="navlink_icon">
                            <i class="bx bx-cog"></i>
                        </span>
                        <span class="navlink">Setting</span>
                    </a>
                </li>
                <li class="item">
                    <a href="#" class="nav_link">
                        <span class="navlink_icon">
                            <i class="bx bx-layer"></i>
                        </span>
                        <span class="navlink">Features</span>
                    </a>
                </li>
            </ul>
            <ul class="menu_items">
                <li class="item">
                    <a href="index.html" class="nav_link" id="logoutButton">
                        <span class="navlink_icon">
                            <i class="bx bx-log-out"></i>
                        </span>
                        <span class="navlink">Logout</span>
                    </a>
                </li>
            </ul>
        </div>
    </nav>

    <!-- Navbar -->
    <nav class="navbar" aria-label="Main Navigation">
        <div class="logo_item">
            <i class="bx bx-menu" id="sidebarToggle"></i>
            <img src="./css/ue-logo.png" alt=""><strong>EAST-Y CHECK</strong>
        </div>
        <div class="navbar_content">
            <i class="bi bi-grid"></i>
            <i class='bx bx-bell'></i>
        </div>
    </nav>

    <!-- Main Content -->
    <div class="main-content">
        <div class="container mt-5">
            <h2 class="text-center font-weight-bold" style="color: #BA0001; opacity: 1;">Import Class List</h2>
            <div class="card">
                <div class="card-header">
                    <h5 class="mb-0">
                        <button class="toggle-button" data-toggle="collapse" data-target="#importClassForm"
                            aria-expanded="true" aria-controls="importClassForm">
                            <span id="toggleSymbol">+</span>
                        </button>
                    </h5>
                </div>
                <div id="importClassForm" class="collapse show">
                    <div class="bg-white p-4 rounded shadow">
                        <form>
                            <div class="form-row">
                                <div class="form-group col-md-6">
                                    <label for="course">Course Name:</label>
                                    <input type="text" id="course" class="form-control" placeholder="Enter Course Name">
                                </div>
                                <div class="form-group col-md-6">
                                    <label for="section">Section:</label>
                                    <input type="text" id="section" class="form-control" placeholder="Enter Section">
                                </div>
                            </div>
                            <div class="form-row">
                                <div class="form-group col-md-6">
                                    <label for="room">Room:</label>
                                    <input type="text" id="room" class="form-control" placeholder="Enter Room">
                                </div>
                            </div>
                            <div class="form-row">
                                <div class="form-group col-md-6">
                                    <label for="startTime">Start Time:</label>
                                    <input type="time" id="startTime" class="form-control">
                                </div>
                                <div class="form-group col-md-6">
                                    <label for="endTime">End Time:</label>
                                    <input type="time" id="endTime" class="form-control">
                                </div>
                            </div>
                            <div class="form-row">
                                <div class="form-group col-md-6">
                                </div>
                                <div class="form-group col-md-6">
                                    <label for="classListFile">Import Class List:</label>
                                    <input type="file" id="classListFile" accept=".csv" class="form-control-file">
                                </div>
                            </div>
                            <div class="d-flex justify-content-between">
                                <button type="button" id="importClassBtn" class="btn btn-primary">Import</button>
                                <button id="manualAddStudentBtn" class="btn btn-primary">Add Student</button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
            <h <h3 class="mt-4">Available Classes</h3>
            <div id="classButtons" class="mt-2"></div>
        </div>
    </div>

    <!-- Modal for Manual Student Input -->
    <div id="manualStudentModal" class="modal fade" tabindex="-1" role="dialog" data-backdrop="static" data-keyboard="false">
        <div class="modal-dialog" role="document">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">Add Student</h5>
                    <button type="button" class="close" data-dismiss="modal" aria-label="Close">
                        <span aria-hidden="true">&times;</span>
                    </button>
                </div>
                <div class="modal-body">
                    <label for="manualId">Student ID:</label>
                    <input type="text" id="manualId" class="form-control" placeholder="Enter Student ID">
                    <label for="manualName">Name:</label>
                    <input type="text" id="manualName" class="form-control" placeholder="Enter Name">
                    <label for="manualRole">Role:</label>
                    <input type="text" id="manualRole" class="form-control" placeholder="Enter Role">
                </div>
                <div class="modal-footer">
                    <button type="button" id="addManualStudent" class="btn btn-success">Add</button>
                    <button type="button" class="btn btn-secondary" data-dismiss="modal">Close</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Modal for Editing Class -->
    <dialog class="modal fade" id="editClassModal" aria-labelledby="editClassModalLabel" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="editClassModalLabel">Edit Class</h5>
                    <button type="button" class="close" data-dismiss="modal" aria-label="Close">
                        <span aria-hidden="true">&times;</span>
                    </button>
                </div>
                <div class="modal-body">
                    <form id="editClassForm">
                        <div class="form-group">
                            <label for="editCourse">Course Name:</label>
                            <input type="text" id="editCourse" class="form-control">
                        </div>
                        <div class="form-group">
                            <label for="editSection">Section:</label>
                            <input type="text" id="editSection" class="form-control">
                        </div>
                        <div class="form-group">
                            <label for="editRoom">Room:</label>
                            <input type="text" id="editRoom" class="form-control">
                        </div>
                        <div class="form-group">
                            <label for="editStartTime">Start Time:</label>
                            <input type="time" id="editStartTime" class="form-control">
                        </div>
                        <div class="form-group">
                            <label for="editEndTime">End Time:</label>
                            <input type="time" id="editEndTime" class="form-control">
                        </div>
                    </form>
                </div>
                <div class="modal-footer">
                    <button id="removeClassBtn" class="btn btn-danger">Remove Class</button>
                    <button type="button" class="btn btn-secondary" data-dismiss="modal">Close</button>
                    <button type="button" class="btn btn-primary" id="saveChangesBtn">Save changes</button>
                </div>
            </div>
        </div>
    </dialog>


    <script>
        const body = document.querySelector("body");
        const sidebar = document.querySelector(".sidebar");
        const sidebarToggle = document.querySelector("#sidebarToggle");
        sidebarToggle.addEventListener("click", () => {
            sidebar.classList.toggle("closed");
            document.querySelector(".main-content").classList.toggle("shifted");
        });

      
        window.addEventListener("resize", () => {
            if (window.innerWidth < 768) {
                sidebar.classList.add("closed");
            } else {
                sidebar.classList.remove("closed");
            }
        });

        // Additional JavaScript for modals and other functionalities...
    </script>

 
    <script src="https://code.jquery.com/jquery-3.5.1.slim.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.9.2/dist/umd/popper.min.js"></script>
    <script src="https://stackpath.bootstrapcdn.com/bootstrap/4. 5.2/js/bootstrap.min.js"></script>
</body>

</html>
