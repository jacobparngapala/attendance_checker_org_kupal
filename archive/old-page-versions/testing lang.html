<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Attendance System</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <script type="module">
        // Import Firebase modules
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getDatabase, ref, get, update } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

        // Firebase configuration
        const firebaseConfig = {
            apiKey: "YOUR_API_KEY",
            authDomain: "YOUR_AUTH_DOMAIN",
            databaseURL: "YOUR_DATABASE_URL",
            projectId: "YOUR_PROJECT_ID",
            storageBucket: "YOUR_STORAGE_BUCKET",
            messagingSenderId: "YOUR_MESSAGING_SENDER_ID",
            appId: "YOUR_APP_ID"
        };

        // Initialize Firebase
        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        // Extract URL parameters
        const urlParams = new URLSearchParams(window.location.search);
        const classId = urlParams.get("classId");
        const teacherId = urlParams.get("teacherId");

        // Define class path
        const classPath = `classes/${teacherId}/${classId}/students`;

        if (!teacherId || !classId) {
            alert("Missing teacher or class ID!");
            console.error("No info found: teacherId or classId is missing.");
        } else {
            fetchClassDetails();
        }

        // Function to load students into dropdown
        function loadStudents() {
            const studentSelect = document.getElementById("studentSelect");
            const studentsRef = ref(db, classPath);

            get(studentsRef).then((snapshot) => {
                if (snapshot.exists()) {
                    studentSelect.innerHTML = ""; // Clear previous options
                    const students = snapshot.val();

                    Object.keys(students).forEach((studentId) => {
                        const student = students[studentId];
                        const option = document.createElement("option");
                        option.value = studentId;
                        option.textContent = student.name;
                        studentSelect.appendChild(option);
                    });
                } else {
                    studentSelect.innerHTML = "<option>No students found</option>";
                }
            }).catch((error) => {
                console.error("Error fetching students:", error);
            });
        }

        // Function to grant attendance access
        window.grantAccess = function() {
            const studentId = document.getElementById("studentSelect").value;
            const message = document.getElementById("message");

            if (!studentId) {
                message.innerHTML = "No student selected.";
                message.style.color = "red";
                return;
            }

            const studentRef = ref(db, `${classPath}/${studentId}`);

            update(studentRef, { canAccessAttendance: true })
                .then(() => {
                    message.innerHTML = `✅ Access granted to student: <strong>${studentId}</strong>`;
                    message.style.color = "green";
                })
                .catch((error) => {
                    message.innerHTML = "❌ Error: " + error.message;
                    message.style.color = "red";
                    console.error("Error updating access:", error);
                });
        };

        // Load students on page load
        window.onload = loadStudents;
    </script>
</head>
<body>
<!-- Attendance Table -->
<div class="container mt-4">
    <div class="card">
        <div class="card-header" style="background-color: #A40000; color: white;">
            <h3 class="mb-0">Class List</h3>
        </div>
        <div class="card-body">
            <table class="table table-bordered table-striped">
                <thead class="thead-dark">
                    <tr>
                        <th>Student ID</th>
                        <th>Name</th>
                        <th>Course</th>
                        <th>Status</th>
                        <th>Timestamp</th>
                    </tr>
                </thead>
                <tbody id="studentTable"></tbody>
            </table>

            <!-- Grant Access Section (Minimal) -->
            <div class="d-flex align-items-center mt-3">
                <select id="studentSelect" class="form-select me-2" style="width: auto;">
                    <option value="">Select Student</option>
                </select>
                <button class="btn btn-success" onclick="grantAccess()">Grant Access</button>
            </div>
            <small id="message" class="text-muted"></small>

            <!-- Reset and Export Buttons -->
            <button class="btn btn-danger mt-3" id="resetButton">Reset</button>
            <button class="btn mt-3" id="saveAttendanceBtn" style="background-color: #A40000; color: white;">Save Attendance</button>
            <button class="btn mt-3" style="background-color: #A40000; color: white;" id="exportBtn">Export</button>
        </div>
    </div>
</div>

    <script>
        // Function to load students into the table
        function loadStudentTable() {
            const studentTable = document.getElementById("studentTable");
            const studentsRef = ref(db, classPath);

            get(studentsRef).then((snapshot) => {
                if (snapshot.exists()) {
                    studentTable.innerHTML = ""; // Clear previous data
                    const students = snapshot.val();

                    Object.keys(students).forEach((studentId) => {
                        const student = students[studentId];
                        const row = document.createElement("tr");

                        row.innerHTML = `
                            <td>${studentId}</td>
                            <td>${student.name}</td>
                            <td>${student.course || "N/A"}</td>
                            <td>${student.status || "Unknown"}</td>
                            <td>${student.timestamp || "N/A"}</td>
                        `;

                        studentTable.appendChild(row);
                    });
                } else {
                    studentTable.innerHTML = "<tr><td colspan='5'>No students found</td></tr>";
                }
            }).catch((error) => {
                console.error("Error fetching student list:", error);
            });
        }

        // Load student table on page load
        window.onload = function () {
            loadStudents();
            loadStudentTable();
        };
    </script>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
